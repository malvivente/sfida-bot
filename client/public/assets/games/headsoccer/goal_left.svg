  <!-- Crossbar & Front Post -->
  <rect x="62" y="2" width="10" height="156" rx="4" fill="url(#postGradLeft)" stroke="#0F172A" stroke-width="2"/>
  <rect x="6" y="2" width="66" height="10" rx="4" fill="url(#postGradLeft)" stroke="#0F172A" stroke-width="2"/>
