      <path d="M0 0 L12 12 M12 0 L0 12" stroke="#22D3EE" stroke-width="1.2" opacity="0.45"/>
    </pattern>
    <linearGradient id="postGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
